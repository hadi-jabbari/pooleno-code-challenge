services:
  postgres:
    image: postgres:17-alpine
    container_name: pooleno-cursor-postgres
    environment:
      POSTGRES_USER: pooleno
      POSTGRES_PASSWORD: pooleno
      POSTGRES_DB: pooleno
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pooleno -d pooleno"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # quay.io is reachable when Docker Hub returns 403.
    image: quay.io/strimzi/kafka:0.45.0-kafka-3.9.0
    container_name: pooleno-cursor-kafka
    command: ["bash", "/opt/start-kraft.sh"]
    ports:
      - "9094:9092"
    volumes:
      - ./docker/start-kraft.sh:/opt/start-kraft.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

volumes:
  postgres_data:
